<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">CityCity product demo</title>
  <desc id="desc">Play the CityCity product walkthrough video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121f"/>
      <stop offset="1" stop-color="#392a5a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff735c"/>
      <stop offset="1" stop-color="#ffb45f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/>
  <circle cx="1120" cy="100" r="230" fill="#6f54a8" opacity=".18"/>
  <circle cx="120" cy="650" r="280" fill="#ff735c" opacity=".12"/>
  <g transform="translate(560 260)">
    <circle cx="80" cy="80" r="80" fill="url(#accent)"/>
    <path d="M60 42 L60 118 L119 80 Z" fill="#fff"/>
  </g>
  <text x="640" y="470" text-anchor="middle" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">CityCity Product Demo</text>
  <text x="640" y="525" text-anchor="middle" fill="#c8c0da" font-family="Inter, Arial, sans-serif" font-size="24">Click to watch the product walkthrough</text>
</svg>
